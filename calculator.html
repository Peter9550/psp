<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
    <body>
        <nav class="top-menu">
            <a href="calculator.html" class="active">Калькулятор</a>
            <a href="about.html">Об авторе</a>
            <a href="https://github.com/Peter9550/psp" target="_blank">GitHub</a>
        </nav>
        <div class="main-wrapper">
            <div class="calc-container">
                <div id="result" class="result">0</div>

                <div class="buttons-grid">
                    <button class="my-btn secondary" id="btn_on_clear">C</button>
                    <button class="my-btn secondary" id="btn_toggle_sign">+/-</button>
                    <button class="my-btn secondary" id="btn_percentage">%</button>
                    <button class="my-btn primary" id="btn_divide">/</button>

                    <button class="my-btn" id="btn_7">7</button>
                    <button class="my-btn" id="btn_8">8</button>
                    <button class="my-btn" id="btn_9">9</button>
                    <button class="my-btn primary" id="btn_multiply">x</button>

                    <button class="my-btn" id="btn_4">4</button>
                    <button class="my-btn" id="btn_5">5</button>
                    <button class="my-btn" id="btn_6">6</button>
                    <button class="my-btn primary" id="btn_minus">-</button>

                    <button class="my-btn" id="btn_1">1</button>
                    <button class="my-btn" id="btn_2">2</button>
                    <button class="my-btn" id="btn_3">3</button>
                    <button class="my-btn primary" id="btn_add">+</button>

                    <button class="my-btn" id="btn_0">0</button>
                    <button class="my-btn" id="btn_decimal">.</button>
                    <button class="my-btn primary execute" id="btn_equals">=</button>
                </div>
            </div>
        </div>
    </body>
</html>
