<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Буфет МГТУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root { --bmstu-blue: #004077; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; color: #333; }

        /* Эффект увеличения карточки при наведении */
        .product-card {
            border: none !important;
            border-radius: 20px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            cursor: pointer;
            background: white;
        }
        .product-card:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08) !important;
        }
        .card-img-top { border-radius: 20px 20px 0 0; object-fit: cover; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
