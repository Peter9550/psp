<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буфет МГТУ им. Н.Э. Баумана</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* 2. Цветовая палитра МГТУ */
        :root {
            --bmstu-blue: #004077;        /* Основной синий */
            --bmstu-blue-dark: #002d54;   /* Темный для акцентов */
            --bmstu-gray: #f2f5f8;        /* Светло-серый фон как на сайте */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bmstu-gray);
            color: #212529;
        }

        /* 3. Стили для карточек (улучшенная форма и тень) */
        .product-card {
            border: none !important;
            border-radius: 12px !important; /* На сайте МГТУ углы менее скругленные, чем в Сбере */
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 64, 119, 0.15) !important;
        }

        /* Стили для заголовков */
        h1, h2, h3 {
            color: var(--bmstu-blue);
            font-weight: 700;
        }

        /* Кастомизация карусели */
        .carousel-item img {
            border-radius: 15px;
            object-fit: cover;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
