<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буфет МГТУ им. Н.Э. Баумана</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root { --bmstu-blue: #004077; --bmstu-bg: #f2f5f8; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bmstu-bg); color: #212529; }

        /* Стили лого и заголовка */
        .logo-box h1 { color: var(--bmstu-blue); font-weight: 800; font-size: 2.5rem; text-transform: uppercase; }

        /* Контейнер таймера */
        .progress-container {
            height: 6px;
            width: 100%;
            background-color: rgba(0, 64, 119, 0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        /* Сама полоска */
        .progress-bar-fill {
            height: 100%;
            background-color: var(--bmstu-blue);
            width: 0;
        }

        /* Анимация заполнения на 5 секунд */
        @keyframes fillProgress {
            from { width: 0; }
            to { width: 100%; }
        }

        /* Класс, который запускает движение */
        .animating {
            animation: fillProgress 5s linear forwards;
        }

        .carousel-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 64, 119, 0.1);
            border: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
